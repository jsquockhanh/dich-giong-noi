
name: Build DQT Dich Giong Noi APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v7

      - name: Cai dat Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cai dat Android SDK
        uses: android-actions/setup-android@v4

      - name: Cai dat Android SDK 37
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: Cap quyen Gradle
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Xuat APK
        uses: actions/upload-artifact@v7
        with:
          name: DQT-dich-giong-noi-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
